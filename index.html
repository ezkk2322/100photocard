<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>100일 포토카드</title>

<style>
@font-face {
  font-family: 'Ddurae';
  src: url('./GriunXHangeul_DDURAE-Rg.ttf') format('truetype');
  font-weight: normal;
  font-style: normal;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;

  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;

  background: #f5f5f5;

  font-family: 'Ddurae', sans-serif;
}


/* =========================
   가로 포토카드
========================= */

.card {
  width: min(700px, 92vw);
  aspect-ratio: 16 / 9;

  perspective: 1400px;

  cursor: pointer;

  margin-bottom: 28px;
}

.card-inner {
  position: relative;

  width: 100%;
  height: 100%;

  transform-style: preserve-3d;

  transition: transform 0.75s cubic-bezier(.2,.7,.2,1);
}

.card.flipped .card-inner {
  transform: rotateY(180deg);
}

.card-front,
.card-back {
  position: absolute;

  inset: 0;

  width: 100%;
  height: 100%;

  border-radius: 22px;

  overflow: hidden;

  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;

  box-shadow: 0 12px 35px rgba(0,0,0,0.16);
}


/* =========================
   앞면
========================= */

.card-front {
  background: #ddd;
}

.card-front img {
  width: 100%;
  height: 100%;

  display: block;

  object-fit: cover;
}


/* =========================
   뒷면
========================= */

.card-back {
  transform: rotateY(180deg);

  display: flex;
  justify-content: center;
  align-items: center;

  padding: 40px;

  background: #ffffff;

  color: #222;

  text-align: center;
}

.back-content {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

.card-name {
  margin-bottom: 20px;

  font-size: clamp(28px, 5vw, 46px);
  line-height: 1.2;
}

.card-message {
  font-size: clamp(25px, 4vw, 40px);

  line-height: 1.45;

  white-space: pre-line;
}


/* =========================
   이름 입력 영역
========================= */

.editor {
  width: min(420px, 92vw);

  padding: 18px;

  background: white;

  border-radius: 16px;

  box-shadow: 0 6px 20px rgba(0,0,0,0.10);
}

.editor-title {
  margin-bottom: 12px;

  text-align: center;

  font-size: 20px;
}

input {
  width: 100%;

  padding: 13px 14px;

  border: 1px solid #ddd;
  border-radius: 10px;

  font-family: 'Ddurae', sans-serif;
  font-size: 17px;

  outline: none;
}

input:focus {
  border-color: #999;
}

button {
  width: 100%;

  margin-top: 10px;

  padding: 13px;

  border: 0;
  border-radius: 10px;

  background: #222;

  color: white;

  font-family: 'Ddurae', sans-serif;
  font-size: 17px;

  cursor: pointer;
}

button:hover {
  opacity: 0.88;
}

.notice {
  margin-top: 10px;

  text-align: center;

  font-size: 14px;

  color: #888;
}


/* 모바일 */

@media (max-width: 480px) {

  .card-back {
    padding: 24px;
  }

  .card-name {
    margin-bottom: 12px;
  }

}

@media (prefers-reduced-motion: reduce) {

  .card-inner {
    transition: none;
  }

}
</style>
</head>

<body>


<!-- =========================
     포토카드
========================= -->

<div class="card" id="card">

  <div class="card-inner">


    <!-- 앞면 -->

    <div class="card-front">

      <img
        src="./card.png"
        alt="100일 포토카드"
      >

    </div>


    <!-- 뒷면 -->

    <div class="card-back">

      <div class="back-content">

        <div
          class="card-name"
          id="cardName"
        >
          OO님
        </div>

        <div class="card-message">
100일을
축하해주셔서
감사합니다!
        </div>

      </div>

    </div>


  </div>

</div>



<!-- =========================
     이름 변경
========================= -->

<div class="editor">

  <div class="editor-title">
    포토카드 이름 설정
  </div>

  <input
    type="text"
    id="nameInput"
    placeholder="이름을 입력하세요"
    maxlength="30"
  >

  <button
    type="button"
    id="copyButton"
  >
    링크 복사하기
  </button>

  <div
    class="notice"
    id="notice"
  >
    이름 입력 후 카드를 눌러 확인해보세요!
  </div>

</div>



<script>

/* =========================
   URL 이름 가져오기
========================= */

const params =
  new URLSearchParams(window.location.search);

const urlName =
  params.get("name");

const name =
  urlName || "OO";


/* =========================
   요소
========================= */

const card =
  document.getElementById("card");

const cardName =
  document.getElementById("cardName");

const nameInput =
  document.getElementById("nameInput");

const copyButton =
  document.getElementById("copyButton");

const notice =
  document.getElementById("notice");


/* =========================
   초기 표시
========================= */

cardName.textContent =
  name + "님";

nameInput.value =
  name;


/* =========================
   카드 뒤집기
========================= */

card.addEventListener(
  "click",
  function () {

    card.classList.toggle("flipped");

  }
);


/* =========================
   이름 실시간 미리보기
========================= */

nameInput.addEventListener(
  "input",
  function () {

    const newName =
      nameInput.value.trim() || "OO";

    cardName.textContent =
      newName + "님";

  }
);


/* =========================
   이름 포함 링크 복사
========================= */

copyButton.addEventListener(
  "click",
  async function () {

    const newName =
      nameInput.value.trim() || "OO";

    const url =
      new URL(window.location.href);

    url.searchParams.set(
      "name",
      newName
    );


    try {

      await navigator.clipboard.writeText(
        url.toString()
      );

      notice.textContent =
        "✓ 링크 복사 완료!";

    }

    catch {

      notice.textContent =
        "링크 복사가 안 되면 주소창 링크를 직접 복사해주세요.";

    }

  }
);

</script>

</body>
</html>
