<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>100일 포토카드</title>

<style>
@font-face {
  font-family: 'Ddurae';
  src: url('./GriunXHangeul_DDURAE-Rg.ttf') format('truetype');
  font-weight: normal;
  font-style: normal;
}

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  background: transparent;
  font-family: 'Ddurae', sans-serif;
}

body {
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 16px;
}


/* =========================
   가로 포토카드
========================= */

.card {
  position: relative;

  width: min(700px, 100%);
  aspect-ratio: 16 / 9;

  perspective: 1400px;

  cursor: pointer;

  isolation: isolate;
}

.card-inner {
  position: relative;

  width: 100%;
  height: 100%;

  transform-style: preserve-3d;

  transition:
    transform 0.75s cubic-bezier(.2,.7,.2,1);
}

.card.flipped .card-inner {
  transform: rotateY(180deg);
}


/* =========================
   반짝 효과
========================= */

.card::after {
  content: "";

  position: absolute;

  inset: -15%;

  z-index: 5;

  pointer-events: none;

  opacity: 0;

  background:
    linear-gradient(
      115deg,
      rgba(255,255,255,0) 35%,
      rgba(255,255,255,0) 42%,
      rgba(255,255,255,0.58) 50%,
      rgba(255,255,255,0) 58%,
      rgba(255,255,255,0) 65%
    );

  transform:
    translateX(-140%)
    skewX(-20deg);
}

.card.shine::after {
  animation:
    shineSweep 0.9s ease;
}

@keyframes shineSweep {

  0% {
    transform:
      translateX(-140%)
      skewX(-20deg);

    opacity: 0;
  }

  30% {
    opacity: 0.25;
  }

  50% {
    opacity: 0.8;
  }

  100% {
    transform:
      translateX(140%)
      skewX(-20deg);

    opacity: 0;
  }

}


/* =========================
   카드 앞 / 뒤 공통
========================= */

.card-front,
.card-back {
  position: absolute;

  inset: 0;

  width: 100%;
  height: 100%;

  border-radius: 22px;

  overflow: hidden;

  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;

  box-shadow:
    0 12px 35px rgba(0,0,0,0.16);
}


/* =========================
   앞면
========================= */

.card-front {
  background: #ddd;
}

.card-front img {
  display: block;

  width: 100%;
  height: 100%;

  object-fit: cover;
}


/* =========================
   뒷면
========================= */

.card-back {
  transform:
    rotateY(180deg);

  display: flex;

  justify-content: center;
  align-items: center;

  padding: 40px;

  background:
    linear-gradient(
      180deg,
      #e3e3e3 0%,
      #cccccc 100%
    );

  color: #222;

  text-align: center;
}

.back-content {
  display: flex;

  flex-direction: column;

  align-items: center;

  justify-content: center;
}

.card-name {
  margin-bottom: 20px;

  font-size:
    clamp(28px, 5vw, 46px);

  line-height: 1.2;
}

.card-message {
  font-size:
    clamp(25px, 4vw, 40px);

  line-height: 1.45;

  white-space: pre-line;
}


/* =========================
   뒷면 싸인
========================= */

.signature-wrap {
  position: absolute;

  right: 18px;
  bottom: 12px;

  z-index: 3;

  pointer-events: none;
}

.signature {
  display: block;

  width:
    clamp(90px, 14vw, 150px);

  height: auto;

  filter:
    brightness(0);

  opacity: 0.95;
}


/* =========================
   모바일
========================= */

@media (max-width: 480px) {

  body {
    padding: 8px;
  }

  .card-back {
    padding: 24px;
  }

  .card-name {
    margin-bottom: 12px;
  }

  .signature-wrap {
    right: 10px;
    bottom: 8px;
  }

}

@media (prefers-reduced-motion: reduce) {

  .card-inner {
    transition: none;
  }

  .card.shine::after {
    animation: none;
  }

}
</style>
</head>


<body>


<div
  class="card"
  id="card"
>

  <div class="card-inner">


    <!-- 앞면 -->

    <div class="card-front">

      <img
        src="./card.png"
        alt="100일 포토카드"
      >

    </div>


    <!-- 뒷면 -->

    <div class="card-back">

      <div class="back-content">

        <div
          class="card-name"
          id="cardName"
        >
          OO님
        </div>

        <div class="card-message">
100일을
축하해주셔서
감사합니다!
        </div>

      </div>


      <div class="signature-wrap">

        <img
          class="signature"
          src="./sign.png"
          alt="사인"
        >

      </div>

    </div>


  </div>

</div>



<script>

/* URL에서 이름 가져오기 */

const params =
  new URLSearchParams(
    window.location.search
  );

const name =
  params.get("name") || "OO";

const card =
  document.getElementById("card");

const cardName =
  document.getElementById("cardName");


/* 이름 표시 */

cardName.textContent =
  name + "님";


/* 카드 뒤집기 + 반짝 */

let shineTimer;

card.addEventListener(
  "click",
  function () {

    card.classList.toggle(
      "flipped"
    );


    card.classList.remove(
      "shine"
    );

    void card.offsetWidth;

    card.classList.add(
      "shine"
    );


    clearTimeout(
      shineTimer
    );

    shineTimer =
      setTimeout(
        function () {

          card.classList.remove(
            "shine"
          );

        },
        900
      );

  }
);

</script>

</body>
</html>
